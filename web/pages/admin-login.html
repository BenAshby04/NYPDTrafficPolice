<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Login - NYPD Violations</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <nav>
            <a href="../index.html" style="text-decoration: none; color:var(--text);"><strong>NYPD Traffic Violations</strong></a>
        </nav>
        <div class="page-center">
            <div class="card" style="width: 100%; max-width: 400px;">
                <h1 style="font-size: 20px; margin-bottom: 6px;">Admin login</h1>
                <p style="color:var(--text-muted); font-size: 13px; margin-bottom: 20px;">
                    Authorised personal only!
                </p>
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password">
                </div>
                <button class="btn btn-primary" id="loginBtn" style="width: 100%;">Login</button>
            </div>
        </div>
        <script src="../js/auth.js"></script>
        <script src="../js/api.js"></script>
        <script src="../js/ui.js"></script>
        <script>
            document.getElementById('loginBtn').addEventListener('click', async function(){
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                if(!username || ! password){
                    showToast('Please fill in both fields','error');
                    return;
                }

                showLoading('loginBtn');

                try{
                    const formData = new URLSearchParams();
                    formData.append('username', username);
                    formData.append('password',password);
                    const res = await fetch('http://127.0.0.1:8000/token/',{
                        method: 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body:formData
                    });
                    if(!res.ok) throw new Error('Incorrect username or password');
                    const tokenData = await res.json();
                    saveToken(tokenData.access_token);
                    const user = await apiFetch('/user/by-username/' + username);
                    if(user.UserRole !== 'admin'){
                        showToast('Access Denied - Admins only','error')
                        setTimeout(function() {
                            logout();
                        }, 1500);
                        return;
                    }
                    sessionStorage.setItem('userRole', user.UserRole);
                    sessionStorage.setItem('username', username);
                    
                    window.location.href = 'admin-dashboard.html';
                } catch(err){
                    showToast(err.message,'error');
                } finally{
                    hideLoading('loginBtn');
                }
            });
        </script>
    </body>
</html>
